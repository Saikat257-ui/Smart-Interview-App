    <meta charset="utf-8" />

    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Interview App</title>
    <script>
      // Suppress ResizeObserver errors BEFORE React loads
      (function() {
        // Patch ResizeObserver to prevent the error from occurring
        const OriginalResizeObserver = window.ResizeObserver;
        if (OriginalResizeObserver) {
          window.ResizeObserver = class extends OriginalResizeObserver {
            constructor(callback) {
              super(function(entries, observer) {
                window.requestAnimationFrame(function() {
                  callback(entries, observer);
                });
              });
            }
          };
        }

        // Suppress console.error for ResizeObserver
        const originalError = console.error;
        console.error = function() {
          const args = Array.from(arguments);
          const firstArg = args[0];
          if (
            (typeof firstArg === 'string' && 
             (firstArg.includes('ResizeObserver loop') || 
              firstArg.includes('ResizeObserver loop completed with undelivered notifications'))) ||
            (firstArg && firstArg.message && 
             (firstArg.message.includes('ResizeObserver loop') ||
              firstArg.message.includes('ResizeObserver loop completed with undelivered notifications')))
          ) {
            return;
          }
          originalError.apply(console, args);
        };

        // Capture errors in the capture phase (before react-error-overlay)
        window.addEventListener('error', function(event) {
          if (
            event.message && 
            (event.message.includes('ResizeObserver loop') ||
             event.message.includes('ResizeObserver loop completed with undelivered notifications'))
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return false;
          }
        }, true);

        // Also patch window.onerror
        const originalOnError = window.onerror;
        window.onerror = function(message, source, lineno, colno, error) {
          if (
            typeof message === 'string' &&
            (message.includes('ResizeObserver loop') ||
             message.includes('ResizeObserver loop completed with undelivered notifications'))
          ) {
            return true;
          }
          if (originalOnError) {
            return originalOnError(message, source, lineno, colno, error);
          }
          return false;
        };
      })();
    </script>
